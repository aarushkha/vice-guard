<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube layout regression</title>
    <style>
      ytd-rich-grid-renderer {
        display: block;
        width: 900px;
        --ytd-rich-grid-items-per-row: 3;
      }
      ytd-rich-grid-row {
        display: block;
      }
      ytd-rich-grid-row > #contents {
        display: flex;
      }
      ytd-rich-item-renderer {
        display: block;
        width: 300px;
        height: 160px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <ytd-rich-grid-renderer>
      <div id="contents">
        <ytd-rich-grid-row
          ><div id="contents">
            <ytd-rich-item-renderer id="video-0"
              ><h3>Cooking</h3></ytd-rich-item-renderer
            >
            <ytd-rich-item-renderer id="video-1"
              ><yt-lockup-view-model
                ><h3>GTA 6 ending</h3></yt-lockup-view-model
              ></ytd-rich-item-renderer
            >
            <ytd-rich-item-renderer id="video-2"
              ><h3>Music</h3></ytd-rich-item-renderer
            >
          </div></ytd-rich-grid-row
        >
        <ytd-rich-grid-row
          ><div id="contents">
            <ytd-rich-item-renderer id="video-3"
              ><h3>Travel</h3></ytd-rich-item-renderer
            >
            <ytd-rich-item-renderer id="video-4"
              ><h3>Sports</h3></ytd-rich-item-renderer
            >
            <ytd-rich-item-renderer id="video-5"
              ><h3>Photography</h3></ytd-rich-item-renderer
            >
          </div></ytd-rich-grid-row
        >
        <ytd-rich-section-renderer style="display: block; height: 100px"
          >Shorts shelf</ytd-rich-section-renderer
        >
        <ytd-rich-item-renderer id="video-6"
          ><h3>Gardening</h3></ytd-rich-item-renderer
        >
      </div>
    </ytd-rich-grid-renderer>
  </body>
</html>
